version: "3.9"

services:

  devopsdb:
    image: sgsk5137/dbimage:automation
    ports:
      - "3306:3306"
    volumes:
      - db_vol:/var/lib/mysql
    networks:
      - app_network

  rabbitmq:
    image: rabbitmq:3-management
    hostname: vpromq01
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app_network

  application:
    image: sgsk5137/appimage:automation
    ports:
      - "2222:8080"

    deploy:
      replicas: 2

      restart_policy:
        condition: on-failure

      resources:
        limits:
          cpus: "1.0"
          memory: 1G

        reservations:
          cpus: "0.5"
          memory: 512M

    depends_on:
      - devopsdb
      - rabbitmq

    networks:
      - app_network

networks:
  app_network:
    driver: overlay

volumes:
  db_vol:
